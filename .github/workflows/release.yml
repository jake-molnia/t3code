name: Build web and execution worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - name: Build web, server, and execution worker
        run: pnpm build
      - name: Retain build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-server-worker
          path: |
            apps/web/dist
            apps/server/dist
