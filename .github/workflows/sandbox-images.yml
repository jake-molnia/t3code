name: Sandbox images
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: t3-images-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [t3-worker, t3-web]
    steps:
      - name: Reserve space for provider images
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build and execute image verification
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: images/t3/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          tags: t3-local:${{ matrix.target }}-${{ github.sha }}
          load: true
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - name: Verify exported image
        env:
          TARGET: ${{ matrix.target }}
          T3_SHA: ${{ github.sha }}
        run: |
          image="t3-local:$TARGET-$T3_SHA"
          case "$TARGET" in
            t3-worker) python3 images/t3/smoke-image.py "$TARGET" "$image" ;;
            t3-web) python3 images/t3/smoke-image.py "$TARGET" "$image" ;;
          esac
          docker image inspect "$image" > "$RUNNER_TEMP/$TARGET.inspect.json"
          printf 't3=%s\n' "$T3_SHA" > "$RUNNER_TEMP/$TARGET.sources.txt"
          awk '/^FROM ghcr.io\/jake-molnia\/agent-runtime-sandbox@/ {print "runtime_base=" $2}' images/t3/Dockerfile >> "$RUNNER_TEMP/$TARGET.sources.txt"
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified image
        env:
          TARGET: ${{ matrix.target }}
          T3_SHA: ${{ github.sha }}
        run: |
          package="ghcr.io/${GITHUB_REPOSITORY,,}-web"
          if [ "$TARGET" = t3-worker ]; then package="ghcr.io/${GITHUB_REPOSITORY,,}-sandbox"; fi
          image="$package:$TARGET-git-$T3_SHA"
          docker tag "t3-local:$TARGET-$T3_SHA" "$image"
          docker push "$image"
          docker image inspect "$image" --format '{{range .RepoDigests}}{{println .}}{{end}}' > "$RUNNER_TEMP/$TARGET.published.txt"
          cat "$RUNNER_TEMP/$TARGET.published.txt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.target }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/${{ matrix.target }}.inspect.json
            ${{ runner.temp }}/${{ matrix.target }}.sources.txt
            ${{ runner.temp }}/${{ matrix.target }}.published.txt
          compression-level: 0
          retention-days: 7
